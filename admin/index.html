<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cruz Verde - Administración</title>

  <link
    rel="stylesheet"
    href="admin.css"
  >

</head>


<body>

  <main class="admin-container">

    <section
      id="login"
      class="login-card"
    >

      <h1>CRUZ VERDE</h1>

      <h2>Panel administrativo</h2>

      <p>
        Ingresa con tu cuenta administrativa
      </p>


      <form id="loginForm">

        <label for="email">
          Correo
        </label>

        <input
          type="email"
          id="email"
          required
        >


        <label for="password">
          Contraseña
        </label>

        <input
          type="password"
          id="password"
          required
        >


        <button
          type="submit"
          id="btnLogin"
        >
          Ingresar
        </button>

      </form>


      <p
        id="loginError"
        class="error oculto"
      ></p>

    </section>


    <section
      id="panel"
      class="panel oculto"
    >

      <header class="panel-header">

        <div>

          <h1>Panel administrativo</h1>

          <p>
            Gestión de reservas
          </p>

        </div>


        <button
          id="btnCerrarSesion"
          class="logout"
        >
          Cerrar sesión
        </button>

      </header>


      <section class="filtro">

  <label for="fechaAdmin">
    Seleccionar fecha
  </label>

  <select id="fechaAdmin">
    <option value="">
      Selecciona una fecha
    </option>
  </select>


  <label for="filtroAgenda">
    Seleccionar agenda
  </label>

  <select id="filtroAgenda">

    <option value="todas">
      Todas las agendas
    </option>

    <option value="cruz_verde">
      Cruz Verde
    </option>

    <option value="maribel">
      Maribel
    </option>

  </select>

</section>

      <section
        id="resumen"
        class="resumen"
      >

        <div>
          <strong id="totalReservas">
            0
          </strong>

          <span>
            Reservas
          </span>
        </div>


        <div>
          <strong id="totalDisponibles">
            0
          </strong>

          <span>
            Disponibles
          </span>
        </div>

      </section>


      <section>

        <h2>
          Reservas
        </h2>

        <div
          id="reservasContainer"
          class="reservas-container"
        >

          <p>
            Selecciona una fecha.
          </p>

        </div>

      </section>

    </section>

  </main>


  <script src="admin.js"></script>

</body>

</html>
